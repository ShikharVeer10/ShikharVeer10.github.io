<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <radialGradient id="circleGlow" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#circleGlow)" />

  <!-- Outer frame border -->
  <rect x="35" y="35" width="1130" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Category Badge -->
  <rect x="80" y="85" width="245" height="40" rx="20" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
  <circle cx="102" cy="105" r="5" fill="#38BDF8" />
  <text x="118" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">AI &amp; SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Shikhar Veeramachineni</text>

  <!-- Tagline Gradient Bar -->
  <rect x="80" y="250" width="1040" height="3" fill="url(#glow)" />

  <!-- Subtitle -->
  <text x="80" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#38BDF8">Building Intelligent Systems, Multimodal AI &amp; Robust Architectures</text>

  <!-- Description lines -->
  <text x="80" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Specializing in multimodal emotion AI systems, document intelligence platforms,</text>
  <text x="80" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">and high-performance backend workflows.</text>

  <!-- Bottom Website / Domain -->
  <g transform="translate(80, 495)">
    <rect width="320" height="46" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#A5B4FC">shikhar-veerdev.vercel.app</text>
  </g>

  <!-- Bottom Right Portfolio Pill -->
  <g transform="translate(870, 495)">
    <rect width="250" height="46" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">Portfolio &amp; Work &#8594;</text>
  </g>
